name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.1)'
        required: false
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Generate changelog
        run: |
          $ErrorActionPreference = 'Stop'
          # 用显式区间生成当前 tag 的 release notes；首个 tag 无 prev-tag 时回退 --latest
          # 完整 CHANGELOG.md 在回写 main 步骤中从 main 历史生成，避免旧 tag 重跑覆盖新历史
          $tag = if ("${{ github.ref_name }}".StartsWith("v")) { "${{ github.ref_name }}" } else { "${{ inputs.tag_name }}" }
          $prevTag = git describe --tags --abbrev=0 --match "v[0-9]*" "$tag^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $prevTag) {
            Write-Output "Generating release notes for range $prevTag..$tag"
            git-cliff "$prevTag..$tag" --strip header -o RELEASE_NOTES.md
          } else {
            Write-Output "No previous tag found, using --latest for release notes"
            git-cliff --latest --strip header -o RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw "git-cliff (release notes) failed with exit code $LASTEXITCODE" }
          Write-Output "===== RELEASE_NOTES.md ====="
          Get-Content RELEASE_NOTES.md -Encoding utf8

      - name: Assemble release body
        id: release-body
        run: |
          $tag = if ("${{ github.ref_name }}".StartsWith("v")) { "${{ github.ref_name }}" } else { "${{ inputs.tag_name }}" }
          $notes = Get-Content RELEASE_NOTES.md -Raw -Encoding utf8
          $notes = $notes.TrimEnd("`r","`n")
          $releaseBody = "$notes`n`n" + @"
          ### 📦 下载与安装 (Assets)
          - **推荐安装包**：下载下方的 `Sticky Todo_${tag}_x64-setup.exe`（自动安装并创建桌面快捷方式，支持系统卸载）。
          - **单文件免安装绿色版**：下载 `sticky-todo.exe` 或 `sticky-todo-windows-x64.zip`，直接运行。

          ### ✨ 核心特性
          - 🪶 极致轻量（~25MB 内存），后台常驻零压力
          - 🎨 现代 WinUI 3 / Fluent Design 质感与 DWM 原生圆角投影
          - 🧲 贴靠屏幕边缘自动折叠隐藏，16px 蓝色提手挂耳触碰即时展开
          - ⚙️ 偏好设置：支持一键开机自启、窗口置顶、一键检查软件更新
          - 📝 完善的待办管理、排序与数据本地安全持久化
          "@
          if ([string]::IsNullOrWhiteSpace($releaseBody)) { throw "releaseBody 为空" }
          "BODY<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          $releaseBody | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Tauri App & Publish Release
        id: build-tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name || inputs.tag_name }}
          releaseName: 'Sticky Todo ${{ github.ref_name || inputs.tag_name }} ✦'
          releaseBody: ${{ steps.release-body.outputs.BODY }}
          releaseDraft: false
          prerelease: false

      - name: Upload Standalone Executable & Archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.ref_name }}".StartsWith("v")) { "${{ github.ref_name }}" } else { "${{ inputs.tag_name }}" }
          $exePath = "src-tauri/target/release/sticky-todo.exe"
          $zipPath = "src-tauri/target/release/sticky-todo-$tag-windows-x64.zip"
          if (Test-Path $exePath) {
            Compress-Archive -Path $exePath -DestinationPath $zipPath -Force
            gh release upload $tag $exePath $zipPath --clobber
          }

      - name: Commit CHANGELOG.md back to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          # 从 main 完整历史生成 changelog：旧 tag 重跑时不会用 tag 历史覆盖 main 上更新的历史
          git-cliff -o CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw "git-cliff (full) failed with exit code $LASTEXITCODE" }
          git add CHANGELOG.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "docs(changelog): update CHANGELOG.md"
            git push origin main
          } else {
            Write-Output "CHANGELOG.md 无变化，跳过提交"
          }

      - name: Generate & Upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # tauri-cli 只产出 .sig，不产出 latest.json，需在此生成
          # tag push 时 GITHUB_REF 为 refs/tags/vX.Y.Z；workflow_dispatch 时取输入
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "${{ inputs.tag_name }}"
          }
          $version = $tag -replace '^v', ''
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $sigPath = Join-Path $nsisDir "Sticky Todo_${version}_x64-setup.exe.sig"
          if (-not (Test-Path $sigPath)) {
            Write-Error "签名文件不存在: $sigPath（构建未启用签名？）"
            exit 1
          }
          $sig = (Get-Content $sigPath -Raw).Trim()
          # 坑：GitHub 上传资产时文件名空格转点号，latest.json 的 url 必须用点号形式
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Sticky.Todo_${version}_x64-setup.exe"
          $json = @{
            version = $version
            notes = "Sticky Todo v$version 更新"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 10
          $latestPath = Join-Path $env:RUNNER_TEMP "latest.json"
          [System.IO.File]::WriteAllText($latestPath, $json, (New-Object System.Text.UTF8Encoding $false))
          gh release upload $tag $latestPath --clobber
          # 自校验：latest.json 端点可达，且其中 url 指向的资产可达
          $endpoint = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/latest.json"
          $r1 = curl.exe -sL -o $env:RUNNER_TEMP\latest-check.json -w "%{http_code}" $endpoint
          $r2 = curl.exe -sL -o NUL -w "%{http_code}" $url
          Write-Output "latest.json 端点: $r1; 安装包: $r2"
          if ($r1 -ne "200" -or $r2 -ne "200") {
            Write-Error "latest.json 端点校验失败（端点 $r1 / 安装包 $r2）"
            exit 1
          }
