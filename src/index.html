<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticky Todo</title>
  <script>
    // 首帧渲染前应用已保存的主题，避免闪烁
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('sticky-todo:theme') || 'system'; } catch (e) {}
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <!-- Custom title bar -->
    <header id="titlebar" data-tauri-drag-region>
      <div class="titlebar-left" data-tauri-drag-region>
        <span class="app-icon">✦</span>
        <span class="app-title" data-tauri-drag-region>便签 Todo</span>
        <button id="btn-update-hint" class="update-hint hidden" title="发现新版本，点击查看">
          <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/>
          </svg>
          <span class="update-hint-text">更新</span>
        </button>
      </div>
      <div class="titlebar-actions">
        <button id="btn-settings" class="titlebar-btn" title="偏好设置">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="8" cy="8" r="2.5"/>
            <path d="M8 1.5v1.2M8 13.3v1.2M1.5 8h1.2M13.3 8h1.2M3.4 3.4l.8.8M11.8 11.8l.8.8M3.4 12.6l.8-.8M11.8 4.2l.8-.8"/>
          </svg>
        </button>
        <button id="btn-minimize" class="titlebar-btn" title="最小化">
          <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button id="btn-close" class="titlebar-btn btn-close" title="隐藏到托盘">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/>
            <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Settings Panel (Flyout / Overlay) -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-header">
        <span class="settings-title">偏好设置</span>
        <button id="btn-close-settings" class="titlebar-btn" title="返回">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.3"/>
            <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </button>
      </div>

      <div class="settings-content">
        <!-- Autostart switch -->
        <div class="settings-row">
          <div class="settings-info">
            <div class="settings-label">开机自启动</div>
            <div class="settings-desc">Windows 启动时自动在后台常驻运行</div>
          </div>
          <label class="fluent-switch">
            <input type="checkbox" id="switch-autostart" />
            <span class="slider"></span>
          </label>
        </div>

        <!-- Always on top switch -->
        <div class="settings-row">
          <div class="settings-info">
            <div class="settings-label">窗口始终置顶</div>
            <div class="settings-desc">保持便签浮在其他应用窗口上方</div>
          </div>
          <label class="fluent-switch">
            <input type="checkbox" id="switch-always-on-top" checked />
            <span class="slider"></span>
          </label>
        </div>

        <!-- Theme selector -->
        <div class="settings-row">
          <div class="settings-info">
            <div class="settings-label">主题</div>
            <div class="settings-desc">选择应用外观样式</div>
          </div>
          <div class="segmented" id="theme-segmented" role="radiogroup" aria-label="主题">
            <button type="button" data-theme-mode="light">浅色</button>
            <button type="button" data-theme-mode="dark">深色</button>
            <button type="button" data-theme-mode="system">跟随系统</button>
          </div>
        </div>

        <!-- Check for updates -->
        <div class="settings-row">
          <div class="settings-info">
            <div class="settings-label">软件更新</div>
            <div class="settings-desc" id="update-status-text">当前版本 v0.3.0</div>
          </div>
          <div class="update-actions">
            <button id="btn-check-update" class="settings-btn">检查更新</button>
            <a id="link-github-release" class="update-fallback hidden" href="#">前往下载</a>
          </div>
        </div>

        <div class="settings-footer">
          <span class="app-version">Sticky Todo v0.3.0 · Tauri 2</span>
          <a href="https://github.com/landfallbox/sticky-todo" target="_blank" class="github-link">GitHub 仓库</a>
        </div>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <textarea id="todo-input" rows="1" placeholder="添加待办事项（Shift+Enter 换行）" autocomplete="off" spellcheck="false"></textarea>
      <button id="btn-add" title="添加">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar">
      <span id="stats-text">0 项待办</span>
      <button id="btn-clear-done" class="link-btn" style="display:none">清除已完成</button>
    </div>

    <!-- Todo list -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- Empty state -->
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">📝</div>
      <p>还没有待办事项</p>
      <p class="empty-hint">在上方输入框添加一个吧</p>
    </div>
  </div>

  <!-- Edge peek strip (visible when snapped to edge) -->
  <div id="edge-peek" class="edge-peek" title="点击或悬停唤醒便签">
    <div class="peek-handle"></div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
