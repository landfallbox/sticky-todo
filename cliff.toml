# git-cliff ~ 配置文件
# 文档: https://git-cliff.org/docs/configuration
# 用法:
#   git-cliff -o CHANGELOG.md                      全量（提交回 main）
#   git-cliff --latest --strip header -o out.md    最近一个 tag 区间（release notes）

[changelog]
# 用于 `--prepend` 时移除旧 header 的标记。
header_marker = "<!-- git-cliff: end of header -->"
header = """
# Changelog

本文件由 git-cliff 自动生成，请勿手动编辑。
<!-- git-cliff: end of header -->
"""
# 每个 release 渲染一次。变量: version / timestamp / commits / commit_parsers_groups。
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim }}
{% for commit in entry.commits %}
- {% if commit.scope %}({{ commit.scope }}) {% endif %}{% if commit.breaking %}[**BREAKING**] {% endif %}{{ commit.message }}
{% endfor %}
{% endfor %}
"""
# 去除 body 首尾空白。
trim = true

[git]
# 按 Conventional Commits 规范解析提交。
conventional_commits = true
# 排除不符合规范的提交（merge、Initial commit 等）。
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = false
# 分组与过滤。`<!-- N -->` 前缀控制分组显示顺序（body 中用 striptags 去除）。
# 注意：skip 规则必须排在对应通用规则之前（git-cliff 取第一个匹配的 parser）。
commit_parsers = [
  # 噪音过滤：版本升级提交、CHANGELOG 回提交（须先于 ^chore / ^docs）。
  { message = "^chore\\(release\\)", skip = true },
  { message = "^docs\\(changelog\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->✨ 新功能" },
  { message = "^fix", group = "<!-- 1 -->🐛 修复" },
  { message = "^perf", group = "<!-- 2 -->⚡ 性能" },
  { message = "^refactor", group = "<!-- 3 -->♻️ 重构" },
  { message = "^docs", group = "<!-- 4 -->📝 文档" },
  { message = "^style", group = "<!-- 5 -->🎨 样式" },
  { message = "^test", group = "<!-- 6 -->🧪 测试" },
  { message = "^build", group = "<!-- 7 -->📦 构建" },
  { message = "^ci", group = "<!-- 8 -->🔧 CI" },
  { message = "^chore", group = "<!-- 9 -->⚙️ 其他" },
]
# 排除未匹配任何 parser 的提交。
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
# 仅包含当前分支的 tag。
use_branch_tags = false
topo_order = false
topo_order_commits = true
# 每个 release 内提交的排序：oldest（旧到新）。
sort_commits = "oldest"
recurse_submodules = false
# 版本号边界来自 git tag（v*），与 tag 推送发布方式对齐。
# 锚定开头并要求 v 后至少一位数字，与 release workflow 的 --match glob 保持一致，
# 避免 dev 等非版本 tag 被当作 release 边界。
tag_pattern = "^v[0-9]+"
